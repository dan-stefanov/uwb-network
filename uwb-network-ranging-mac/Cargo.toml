[package]
name = "uwb-network-ranging-mac"
version = "0.1.0"
edition = "2024"
authors = ["Dan Stefanov <danstefanov.u@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
heapless = { version = "0.9.2" }
defmt = { version = "1.0.1", optional = true }
embassy-time = { version = "0.5.0" }

uwb-network-phy = { version = "0.1.0", path = "../uwb-network-phy" }

[features]
defmt = ["dep:defmt", "heapless/defmt", "embassy-time/defmt", "uwb-network-phy/defmt"]
functional_tests = ["defmt"]
